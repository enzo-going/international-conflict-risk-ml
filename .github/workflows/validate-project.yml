name: Validate project artifacts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate pipeline state
        run: python src/validation/validate_pipeline_state.py

      - name: Validate project artifacts
        run: python src/validation/validate_project_artifacts.py

      - name: Validate reproducibility contract
        run: python src/validation/validate_reproducibility_contract.py
